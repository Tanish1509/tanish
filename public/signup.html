<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l5 10-5 10-5-10z"/></svg>
      <span class="brand-name">Waypoint</span>
    </div>
    <p class="auth-subtitle">Create an account to start your 75-day challenge</p>

    <form id="signup-form" class="auth-form">
      <label>
        Username
        <input type="text" id="username" autocomplete="username" required minlength="3" />
      </label>
      <label>
        Password
        <input type="password" id="password" autocomplete="new-password" required minlength="6" />
      </label>
      <label>
        Confirm password
        <input type="password" id="confirm-password" autocomplete="new-password" required minlength="6" />
      </label>
      <p id="auth-error" class="auth-error hidden"></p>
      <button type="submit">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
  </div>

  <script src="auth.js"></script>
  <script>
    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm-password").value;

      if (password !== confirm) {
        showAuthError("Passwords don't match.");
        return;
      }

      submitAuth("/api/signup", {
        username: document.getElementById("username").value,
        password,
      });
    });
  </script>
</body>
</html>
